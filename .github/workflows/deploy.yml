name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Force-push built code to deploy branch
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -f public/build
          git commit -m "Deploy build $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
          git push origin HEAD:deploy --force

      - name: Debug secret length
        run: echo "Length: ${#URL}"
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

      - name: Trigger the webhook
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            --max-time 150 \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "Response body: $body"
          if [ "$http_code" -ne 200 ]; then
            echo "Webhook call failed"
            exit 1
          fi
