name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Force-push built code to deploy branch
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -f public/build
          git commit -m "Deploy build $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
          git push origin HEAD:deploy --force

      - name: Trigger the webhook
        run: |
          # Hostinger appears to intermittently drop connections from
          # GitHub Actions' cloud-datacenter IP ranges (confirmed: the same
          # call succeeds instantly when made from the server itself), so
          # retry a few times with backoff before giving up.
          max_attempts=4
          attempt=1
          success=false

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            response=$(curl -s -w "\n%{http_code}" -X POST \
              --max-time 60 \
              "${{ secrets.DEPLOY_WEBHOOK_URL }}")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP status: $http_code"
            echo "Response body: $body"

            if [ "$http_code" -eq 200 ]; then
              success=true
              break
            fi

            echo "Attempt $attempt failed, waiting before retry..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done

          if [ "$success" != "true" ]; then
            echo "Webhook call failed after $max_attempts attempts"
            exit 1
          fi
